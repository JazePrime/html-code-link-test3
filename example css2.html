<!DOCTYPE html>
<html>
<head>
    <title>My Simple Website</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f0e8;
            margin: 0;
            text-align: center;
        }

        header {
            background-color: #8b7355;
            color: white;
            padding: 25px;
        }

        nav {
            background-color: #d8c3a5;
            padding: 15px;
        }

        nav a {
            color: #4b3621;
            text-decoration: none;
            margin: 15px;
        }

        .content {
            padding: 50px;
        }

        button {
            background-color: #8b7355;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 5px;
            cursor: pointer;
        }

        footer {
            background-color: #8b7355;
            color: white;
            padding: 15px;
        }
    </style>
</head>

<body>

    <header>
        <h1>Welcome to My Website!</h1>
        <p>A simple and beautiful website</p>
    </header>

    <nav>
        <a href="#home">Home</a>
        <a href="#about">About</a>
        <a href="#contact">Contact</a>
    </nav>

    <div class="content" id="home">
        <h2>Hello, Everyone!</h2>
        <p>Welcome to my first HTML website.</p>
        <p>This website was created using HTML and CSS.</p>
        <button onclick="alert('Thank you for visiting!')">
            Click Me
        </button>
    </div>

    <footer>
        <p>© 2026 My Simple Website</p>
    </footer>

</body>
</html>
